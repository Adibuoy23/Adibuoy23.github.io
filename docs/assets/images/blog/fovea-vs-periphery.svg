<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Hind, Helvetica, Arial, sans-serif" font-size="18">
  <!-- eyeball, centre (400,200), radius 150 -->
  <circle cx="400" cy="200" r="150" fill="#f7f7f7" stroke="#333" stroke-width="3"/>
  <!-- periphery: the back wall of the eye, from -65 to +65 degrees -->
  <path d="M 463.4 64.1 A 150 150 0 0 1 463.4 335.9" fill="none" stroke="#1E88E5" stroke-width="10" stroke-linecap="round"/>
  <!-- fovea: small spot on the back wall, straight behind the lens -->
  <circle cx="550" cy="200" r="10" fill="#e53935" stroke="#fff" stroke-width="2"/>
  <!-- lens at the front -->
  <ellipse cx="258" cy="200" rx="14" ry="42" fill="#cfe4f7" stroke="#333" stroke-width="3"/>
  <!-- two objects out in the world -->
  <circle cx="95" cy="200" r="14" fill="#1E88E5"/>
  <circle cx="95" cy="90" r="14" fill="#1E88E5"/>
  <!-- rays: fixated object lands on the fovea; the other crosses the lens and lands on the periphery at +40 degrees -->
  <line x1="111" y1="200" x2="540" y2="200" stroke="#e53935" stroke-width="2.5" stroke-dasharray="6 5"/>
  <line x1="108" y1="98" x2="258" y2="200" stroke="#888" stroke-width="2.5" stroke-dasharray="6 5"/>
  <line x1="258" y1="200" x2="514.9" y2="296.4" stroke="#888" stroke-width="2.5" stroke-dasharray="6 5"/>
  <circle cx="514.9" cy="296.4" r="7" fill="#888"/>
  <!-- labels -->
  <text x="95" y="240" text-anchor="middle" fill="#333">What you look at</text>
  <text x="95" y="62" text-anchor="middle" fill="#333">Everything else</text>
  <text x="258" y="270" text-anchor="middle" fill="#333">Lens</text>
  <text x="590" y="110" fill="#1E88E5" font-weight="600">Periphery</text>
  <text x="590" y="132" fill="#1E88E5" font-size="15">blurry vision</text>
  <line x1="588" y1="118" x2="528" y2="118" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="590" y="205" fill="#e53935" font-weight="600">Fovea</text>
  <text x="590" y="227" fill="#e53935" font-size="15">sharp vision</text>
  <text x="590" y="310" fill="#666" font-size="15">lands in the periphery</text>
  <line x1="588" y1="304" x2="526" y2="298" stroke="#888" stroke-width="1.5"/>
</svg>
